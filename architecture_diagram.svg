<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Agentic AI System — Architecture &amp; Control Flow</text>

  <!-- Goal input -->
  <rect x="380" y="60" width="220" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="490" y="90" text-anchor="middle" font-size="14" fill="#1E1B4B">User Goal (natural language)</text>

  <!-- Planning Module -->
  <rect x="360" y="150" width="260" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="490" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">PlanningModule</text>
  <text x="490" y="197" text-anchor="middle" font-size="11.5" fill="#065F46">Decomposes goal into ordered Step objects</text>
  <text x="490" y="212" text-anchor="middle" font-size="11.5" fill="#065F46">(tool + args per step)</text>

  <!-- Plan trace -->
  <rect x="700" y="150" width="230" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="815" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#78350F">Trace.note()</text>
  <text x="815" y="197" text-anchor="middle" font-size="11.5" fill="#92400E">Prints/logs the visible plan</text>
  <text x="815" y="212" text-anchor="middle" font-size="11.5" fill="#92400E">before any execution</text>

  <!-- Execution Module -->
  <rect x="330" y="260" width="320" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="490" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">ExecutionModule</text>
  <text x="490" y="305" text-anchor="middle" font-size="11.5" fill="#1D4ED8">Runs each step; on exception:</text>
  <text x="490" y="321" text-anchor="middle" font-size="11.5" fill="#1D4ED8">reformulates args, backs off, retries</text>
  <text x="490" y="337" text-anchor="middle" font-size="11.5" fill="#1D4ED8">(up to max_retries) before marking failed</text>
  <text x="490" y="353" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1D4ED8">← this is the self-correction loop</text>

  <!-- Tools box -->
  <rect x="60" y="400" width="360" height="120" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5"/>
  <text x="240" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">Tools</text>
  <rect x="85" y="440" width="145" height="55" rx="6" fill="#ffffff" stroke="#DB2777"/>
  <text x="157" y="463" text-anchor="middle" font-size="12" fill="#831843">web_search_tool</text>
  <text x="157" y="480" text-anchor="middle" font-size="10" fill="#9D174D">(ddgs backend)</text>
  <rect x="250" y="440" width="145" height="55" rx="6" fill="#ffffff" stroke="#DB2777"/>
  <text x="322" y="463" text-anchor="middle" font-size="12" fill="#831843">calculator_tool</text>
  <text x="322" y="480" text-anchor="middle" font-size="10" fill="#9D174D">(safe AST eval)</text>

  <!-- Failure/retry callout -->
  <rect x="480" y="400" width="220" height="120" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="590" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1D1D">Induced Failure</text>
  <text x="590" y="445" text-anchor="middle" font-size="11" fill="#991B1B">Step 3 raises a</text>
  <text x="590" y="461" text-anchor="middle" font-size="11" fill="#991B1B">simulated TimeoutError</text>
  <text x="590" y="479" text-anchor="middle" font-size="11" fill="#991B1B">on first attempt only</text>
  <text x="590" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#991B1B">→ recovered on retry</text>

  <!-- Reporting Module -->
  <rect x="330" y="560" width="320" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="490" y="583" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">ReportingModule</text>
  <text x="490" y="602" text-anchor="middle" font-size="11.5" fill="#5B21B6">Synthesizes final_report.json + markdown_report</text>

  <!-- Arrows -->
  <line x1="490" y1="110" x2="490" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="620" y1="185" x2="700" y2="185" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="490" y1="220" x2="490" y2="260" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="400" y1="360" x2="280" y2="400" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="560" y1="360" x2="560" y2="400" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="280" y1="400" x2="400" y2="360" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="270" y="392" font-size="10" fill="#6B7280">tool result</text>
  <line x1="560" y1="400" x2="560" y2="360" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="565" y="392" font-size="10" fill="#6B7280">exception</text>
  <line x1="490" y1="360" x2="490" y2="560" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="500" y="470" font-size="10" fill="#6B7280">all steps done</text>

  <text x="490" y="628" text-anchor="middle" font-size="11" fill="#6B7280">Goal → Plan (visible trace) → Execute (tools + retry/self-correct) → Report (JSON + Markdown)</text>
</svg>
